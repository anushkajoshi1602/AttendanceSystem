server.port=8080
spring.application.name=student-attendance-system

# Database properties read from environment variables (defaults match local MySQL setup)
db.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_db}
db.user=${DB_USER:root}
db.password=${DB_PASSWORD:}

# JSON date formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
